<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="card">
      <div class="brand"><span class="dot"></span> Real-Time Chat</div>
      <p class="sub">Multi-room chat over WebSockets, stored in MongoDB.</p>
      <label for="username">Display name</label>
      <input id="username" maxlength="20" autocomplete="off" placeholder="e.g. Manideep" required>
      <label for="room">Room</label>
      <select id="room">
        <option value="general"># general</option>
        <option value="devops"># devops</option>
        <option value="random"># random</option>
      </select>
      <button type="submit">Join chat</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <section id="chat" class="chat hidden">
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> Real-Time Chat</div>
      <h4>Rooms</h4>
      <ul id="rooms" class="rooms"></ul>
      <h4>Online in room <span id="user-count" class="count">0</span></h4>
      <ul id="users" class="users"></ul>
      <div class="meta">
        <div>Signed in as <strong id="me"></strong></div>
        <div>Served by <code id="host">-</code></div>
        <div>Socket <span id="status" class="status off">offline</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="room-head"><h2 id="room-title"># general</h2></header>
      <ol id="messages" class="messages"></ol>
      <div id="typing" class="typing"></div>
      <form id="composer" class="composer">
        <input id="text" autocomplete="off" maxlength="500" placeholder="Type a message and press Enter">
        <button type="submit">Send</button>
      </form>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
